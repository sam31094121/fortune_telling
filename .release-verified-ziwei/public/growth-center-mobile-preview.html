<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Growth Center Mobile Preview</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #050505; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 18px; box-sizing: border-box; }
    iframe {
      width: 390px;
      height: 844px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 28px;
      background: #050505;
      box-shadow: 0 18px 70px rgba(0,0,0,.55);
    }
  </style>
</head>
<body>
  <iframe id="codexMobileGrowthFrame" src="/growth-center" title="mobile growth center preview"></iframe>
</body>
</html>
