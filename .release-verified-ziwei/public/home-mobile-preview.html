<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首頁手機版預覽</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      background: #020617;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    .phone {
      width: min(390px, 100vw);
      height: 844px;
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 34px;
      overflow: hidden;
      background: #020617;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
    }
    iframe {
      display: block;
      width: 390px;
      max-width: 100%;
      height: 844px;
      border: 0;
      background: #020617;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="390 x 844 mobile preview">
    <iframe src="/" title="首頁手機版"></iframe>
  </main>
</body>
</html>
